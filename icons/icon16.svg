<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect width="16" height="16" rx="3" fill="#0f3460"/>
  <g transform="translate(8,8)">
    <!-- Left page -->
    <path d="M-0.5,-4.5 L-0.5,4.5 L-6,3 L-6,-3.5 Z" fill="none" stroke="white" stroke-width="1" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M0.5,-4.5 L0.5,4.5 L6,3 L6,-3.5 Z" fill="none" stroke="white" stroke-width="1" stroke-linejoin="round"/>
    <!-- Book spine -->
    <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="white" stroke-width="0.8"/>
    <!-- Left page lines -->
    <line x1="-4.5" y1="-2" x2="-1.5" y2="-1.2" stroke="white" stroke-width="0.5" opacity="0.6"/>
    <line x1="-4.5" y1="0" x2="-1.5" y2="0.8" stroke="white" stroke-width="0.5" opacity="0.6"/>
    <line x1="-4.5" y1="2" x2="-1.5" y2="2.8" stroke="white" stroke-width="0.5" opacity="0.6"/>
    <!-- Right page lines -->
    <line x1="1.5" y1="-1.2" x2="4.5" y2="-2" stroke="white" stroke-width="0.5" opacity="0.6"/>
    <line x1="1.5" y1="0.8" x2="4.5" y2="0" stroke="white" stroke-width="0.5" opacity="0.6"/>
    <line x1="1.5" y1="2.8" x2="4.5" y2="2" stroke="white" stroke-width="0.5" opacity="0.6"/>
  </g>
</svg>
