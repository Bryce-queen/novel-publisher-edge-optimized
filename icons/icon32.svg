<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0f3460"/>
  <g transform="translate(16,16)">
    <!-- Left page -->
    <path d="M-1,-9 L-1,9 L-12,7 L-12,-7 Z" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M1,-9 L1,9 L12,7 L12,-7 Z" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Book spine -->
    <line x1="0" y1="-9" x2="0" y2="9" stroke="white" stroke-width="1.2"/>
    <!-- Left page lines -->
    <line x1="-9" y1="-4" x2="-3" y2="-2.4" stroke="white" stroke-width="0.8" opacity="0.6"/>
    <line x1="-9" y1="0" x2="-3" y2="1.6" stroke="white" stroke-width="0.8" opacity="0.6"/>
    <line x1="-9" y1="4" x2="-3" y2="5.6" stroke="white" stroke-width="0.8" opacity="0.6"/>
    <!-- Right page lines -->
    <line x1="3" y1="-2.4" x2="9" y2="-4" stroke="white" stroke-width="0.8" opacity="0.6"/>
    <line x1="3" y1="1.6" x2="9" y2="0" stroke="white" stroke-width="0.8" opacity="0.6"/>
    <line x1="3" y1="5.6" x2="9" y2="4" stroke="white" stroke-width="0.8" opacity="0.6"/>
  </g>
</svg>
